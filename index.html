<html lang="en">
<head>

<body>
    <div>This is my Discord Webhook Scammers!</div>

    <a href="https://discord.com/api/webhooks/1559385346981109761/5wPQOkRiu61hLtHjbKCaBdHc5GKINUK9O1o0n_28xKv_XbZV6PXMyvUSS4rqkJWdA-1D">Discord Webhook</a>

    <textarea id="message" placeholder="Type your message here..."></textarea>

    <button id="send">Send Messages to my webhook</button>

    <div id="status" role="status"></div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1559385346981109761/5wPQOkRiu61hLtHjbKCaBdHc5GKINUK9O1o0n_28xKv_XbZV6PXMyvUSS4rqkJWdA-1D";

        document.getElementById("send").addEventListener("click", async () => {
            const message = document.getElementById("message").value.trim();
            const status = document.getElementById("status");

            if (!message) {
                status.textContent = "Please enter a message.";
                return;
            }

            status.textContent = "Sending...";

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        content: message
                    })
                });

                if (response.ok) {
                    status.textContent = "Message sent successfully!";
                    document.getElementById("message").value = "";
                } else {
                    status.textContent = "Failed to send message. Check the webhook.";
                }
            } catch (error) {
                status.textContent = "Request failed. Please try again.";
            }
        });
    </script>
